<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>De HUB — Free Key Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a1a2e 0%, #0f0f18 60%, #0a0a10 100%);
    color: #f0f0f5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    background: rgba(22, 22, 27, 0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(99, 102, 241, 0.2);
    border-radius: 20px;
    padding: 40px 32px;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.03) inset,
      0 0 60px rgba(99, 102, 241, 0.1);
    animation: fadeIn 0.6s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    text-align: center;
    margin-bottom: 8px;
  }

  .logo h1 {
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  .subtitle {
    text-align: center;
    color: #8c8c9b;
    font-size: 14px;
    margin-bottom: 32px;
  }

  .label {
    display: block;
    color: #b4b4c2;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .select-wrapper {
    position: relative;
    margin-bottom: 20px;
  }

  .select-wrapper::after {
    content: "▼";
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    color: #6366f1;
    font-size: 12px;
    pointer-events: none;
  }

  select {
    width: 100%;
    padding: 16px 20px;
    background: rgba(30, 30, 36, 0.9);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 12px;
    color: #f0f0f5;
    font-size: 15px;
    appearance: none;
    cursor: pointer;
    transition: all 0.2s;
    outline: none;
  }

  select:hover {
    border-color: rgba(99, 102, 241, 0.6);
  }

  select:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }

  option {
    background: #1e1e24;
    color: #f0f0f5;
  }

  .btn {
    width: 100%;
    padding: 16px 24px;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transition: left 0.6s;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(99, 102, 241, 0.5);
  }

  .btn:hover::before {
    left: 100%;
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .result {
    margin-top: 24px;
    padding: 20px;
    background: rgba(30, 30, 36, 0.9);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 12px;
    display: none;
    animation: slideIn 0.4s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result.show { display: block; }

  .result-label {
    font-size: 12px;
    color: #8c8c9b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .key-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(15, 15, 20, 0.8);
    border: 1px solid rgba(99, 102, 241, 0.4);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }

  .key-text {
    flex: 1;
    font-family: "Courier New", monospace;
    font-size: 16px;
    font-weight: 700;
    color: #a5b4fc;
    letter-spacing: 1px;
    word-break: break-all;
  }

  .copy-btn {
    background: rgba(99, 102, 241, 0.2);
    border: 1px solid rgba(99, 102, 241, 0.5);
    color: #a5b4fc;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .copy-btn:hover {
    background: rgba(99, 102, 241, 0.4);
    color: #fff;
  }

  .copy-btn.copied {
    background: rgba(34, 197, 94, 0.3);
    border-color: rgba(34, 197, 94, 0.6);
    color: #4ade80;
  }

  .hint {
    font-size: 12px;
    color: #8c8c9b;
    line-height: 1.6;
  }

  .hint .timer {
    color: #fbbf24;
    font-weight: 700;
  }

  .status {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    display: none;
    text-align: center;
  }

  .status.show { display: block; }

  .status.loading {
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.3);
    color: #a5b4fc;
  }

  .status.error {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #f87171;
  }

  .status.success {
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: #4ade80;
  }

  .footer {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid rgba(99, 102, 241, 0.15);
    text-align: center;
    font-size: 12px;
    color: #5a5a68;
  }

  .footer a {
    color: #6366f1;
    text-decoration: none;
    font-weight: 600;
  }

  .footer a:hover {
    color: #a5b4fc;
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <h1>🔑 De HUB</h1>
  </div>
  <p class="subtitle">Free Key Generator</p>

  <label class="label" for="gameSelect">Select your game</label>
  <div class="select-wrapper">
    <select id="gameSelect">
      <option value="lt2">🪓 Lumber Tycoon 2 (24 hours)</option>
      <option value="mm2">🔪 MM2 (Murder Mystery 2) (6 hours)</option>
    </select>
  </div>

  <button class="btn" id="getKeyBtn" onclick="generateKey()">
    Generate Key →
  </button>

  <div class="status" id="status"></div>

  <div class="result" id="result">
    <div class="result-label">Your Key</div>
    <div class="key-box">
      <span class="key-text" id="keyText">—</span>
      <button class="copy-btn" id="copyBtn" onclick="copyKey()">Copy</button>
    </div>
    <p class="hint">
      Copy this key and enter it in the script. Do not share it with anyone.<br>
      ⏰ Expires in: <span class="timer" id="timer">--:--:--</span>
    </p>
  </div>

  <div class="footer">
    Need premium? <a href="https://t.me/Dehubkeys_bot" target="_blank">Open @Dehubkeys_bot</a>
  </div>
</div>

<script>
  // ============================================================
  // FIREBASE CONFIG — LT2 и MM2
  // ============================================================
  const FIREBASE_CONFIG = {
    lt2: {
      projectId: "de-hub-lumber-key-syste",
      apiKey: "AIzaSyDG8Nb48bUdRQjRn8B1a-pukxnvzD2FEt8",
      collection: "keys"
    },
    mm2: {
      projectId: "mm2-dehub-keys",
      apiKey: "AIzaSyCes8El6eOtLBUBtJfqLq8_oGMOKy9JilM",
      collection: "keys"
    }
  };

  // Сроки Basic-ключей
  const LT2_BASIC_HOURS = 24;
  const MM2_BASIC_HOURS = 6;

  let timerInterval = null;

  // ============================================================
  // ГЕНЕРАЦИЯ КЛЮЧА
  // ============================================================
  function genKeyString(prefix) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const groups = [];
    for (let g = 0; g < 3; g++) {
      let part = "";
      for (let i = 0; i < 4; i++) {
        part += chars[Math.floor(Math.random() * chars.length)];
      }
      groups.push(part);
    }
    return `${prefix}-${groups.join("-")}`;
  }

  async function writeKeyToFirebase(config, key, expireDate) {
    const url = `https://firestore.googleapis.com/v1/projects/${config.projectId}/databases/(default)/documents/${config.collection}?key=${config.apiKey}`;

    const body = {
      fields: {
        key: { stringValue: key },
        tier: { stringValue: "basic" },
        createdAt: { timestampValue: new Date().toISOString() },
        expireAt: { timestampValue: expireDate.toISOString() }
      }
    };

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error("Firebase error: " + err);
    }

    return await res.json();
  }

  async function generateKey() {
    const game = document.getElementById("gameSelect").value;
    const config = FIREBASE_CONFIG[game];

    const btn = document.getElementById("getKeyBtn");
    btn.disabled = true;
    btn.textContent = "Generating...";
    hideResult();
    hideStatus();

    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    showStatus("Generating your key...", "loading");

    try {
      const prefix = game === "lt2" ? "LT2" : "MM2";
      const key = genKeyString(prefix);

      // Срок: LT2 = 24ч, MM2 = 6ч
      const hours = game === "lt2" ? LT2_BASIC_HOURS : MM2_BASIC_HOURS;
      const expireDate = new Date(Date.now() + hours * 60 * 60 * 1000);

      await writeKeyToFirebase(config, key, expireDate);

      showStatus("Key generated successfully!", "success");
      showResult(key, expireDate);
    } catch (e) {
      console.error(e);
      showStatus("Error: " + e.message, "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Generate Key →";
    }
  }

  // ============================================================
  // UI HELPERS
  // ============================================================
  function showStatus(text, type) {
    const el = document.getElementById("status");
    el.textContent = text;
    el.className = "status show " + type;
  }

  function hideStatus() {
    document.getElementById("status").className = "status";
  }

  function showResult(key, expireDate) {
    document.getElementById("keyText").textContent = key;
    document.getElementById("result").classList.add("show");
    document.getElementById("copyBtn").textContent = "Copy";
    document.getElementById("copyBtn").classList.remove("copied");

    startTimer(expireDate);
  }

  function hideResult() {
    document.getElementById("result").classList.remove("show");
  }

  function startTimer(expireDate) {
    const timerEl = document.getElementById("timer");

    function update() {
      const now = Date.now();
      const left = expireDate.getTime() - now;

      if (left <= 0) {
        timerEl.textContent = "expired";
        timerEl.style.color = "#f87171";
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        return;
      }

      const totalSec = Math.floor(left / 1000);
      const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
      const s = String(totalSec % 60).padStart(2, "0");

      timerEl.textContent = `${h}:${m}:${s}`;
      timerEl.style.color = "#fbbf24";
    }

    update();
    timerInterval = setInterval(update, 1000);
  }

  function copyKey() {
    const key = document.getElementById("keyText").textContent;
    if (!key || key === "—") return;

    navigator.clipboard.writeText(key).then(() => {
      const btn = document.getElementById("copyBtn");
      btn.textContent = "✓ Copied";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = "Copy";
        btn.classList.remove("copied");
      }, 2000);
    });
  }
</script>

</body>
</html>
